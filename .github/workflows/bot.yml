name: DMC Trading Bot

on:
  schedule:
    - cron: '0 0 * * 1'            # 每週一 00:00 UTC 更新幣種清單（每15分鐘由外部 cron-job.org 觸發）
  workflow_dispatch:                  # 允許手動觸發

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 防止 fetch 卡住空燒整輪（正常 run <1 分鐘）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore state from state branch
        run: |
          git fetch origin state --depth=1 2>/dev/null || echo "No state branch yet, starting fresh"
          git show origin/state:positions_dmc.json > positions_dmc.json 2>/dev/null || echo '{"open":[],"closed":[],"cooldown":{}}' > positions_dmc.json
          git show origin/state:trades_dmc.csv     > trades_dmc.csv     2>/dev/null || true
          git show origin/state:safety-check-log-dmc.json > safety-check-log-dmc.json 2>/dev/null || true
          git show origin/state:report.json        > report.json        2>/dev/null || true
          git show origin/state:watchlist_dmc.json > watchlist_dmc.json 2>/dev/null || true
          # DN（模擬盤）：repo 裡有 Railway 時代的舊 state 檔，必須明確覆蓋
          git show origin/state:positions_dn.json  > positions_dn.json  2>/dev/null || echo '{"open":[],"closed":[],"cooldown":{}}' > positions_dn.json
          git show origin/state:trades_dn.csv      > trades_dn.csv      2>/dev/null || echo 'Date,Time(UTC),Symbol,Side,Entry,Exit,PnL,Reason,Mode,OrderID' > trades_dn.csv
          git show origin/state:safety-check-log-dn.json > safety-check-log-dn.json 2>/dev/null || true
          git show origin/state:watchlist_dn.json  > watchlist_dn.json  2>/dev/null || true
          echo "State restored"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run DMC bot (Strategy B)
        env:
          DATA_DIR: "."
          OKX_API_KEY:          ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:       ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE:       ${{ secrets.OKX_PASSPHRASE }}
          DMC_PAPER_TRADING:    ${{ vars.DMC_PAPER_TRADING }}
          PORTFOLIO_VALUE_USD:  ${{ vars.PORTFOLIO_VALUE_USD }}
          MAX_TRADE_SIZE_USD:   ${{ vars.MAX_TRADE_SIZE_USD }}
          RISK_PCT:             ${{ vars.RISK_PCT }}
          DMC_MAX_OPEN:         ${{ vars.DMC_MAX_OPEN }}
          DAILY_LOSS_LIMIT_PCT: ${{ vars.DAILY_LOSS_LIMIT_PCT }}
        run: node bot_dmc.js
        continue-on-error: true

      - name: Run DN bot (Donchian, LIVE on dnbot01 sub-account)
        env:
          DATA_DIR: "."
          # LIVE：跑在獨立的 OKX 子帳戶 dnbot01（與 DMC 主帳戶完全隔離，$200 上限）
          # 用 OKX_DN_* 金鑰，DMC 用主帳戶的 OKX_*，兩者互不領養對方倉位
          DONCHIAN_PAPER_TRADING: "false"
          OKX_API_KEY:          ${{ secrets.OKX_DN_API_KEY }}
          OKX_SECRET_KEY:       ${{ secrets.OKX_DN_SECRET_KEY }}
          OKX_PASSPHRASE:       ${{ secrets.OKX_DN_PASSPHRASE }}
          PORTFOLIO_VALUE_USD:  "200"      # live 時實際讀子帳戶餘額，此為 fallback
          RISK_PCT:             "0.01"     # $200 × 1% = 每筆約 $2 敞口（極小額驗證）
          DONCHIAN_MAX_OPEN:    "4"        # 上限降到 4 筆
          DAILY_LOSS_LIMIT_PCT: ${{ vars.DAILY_LOSS_LIMIT_PCT }}
        run: node bot_donchian.js
        continue-on-error: true

      - name: Generate report
        env:
          DATA_DIR: "."
          OKX_API_KEY:    ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: node generate_report.js
        continue-on-error: true

      - name: Save state to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 用 git 底層指令建立 state branch 的 commit，不切換工作目錄的 branch
          git fetch origin state:refs/heads/state 2>/dev/null || true

          git read-tree --empty
          for f in positions_dmc.json trades_dmc.csv safety-check-log-dmc.json report.json watchlist_dmc.json \
                   positions_dn.json trades_dn.csv safety-check-log-dn.json watchlist_dn.json; do
            [ -f "$f" ] && git update-index --add "$f"
          done

          TREE=$(git write-tree)
          PARENT=$(git rev-parse --verify refs/heads/state 2>/dev/null || echo "")
          MSG="state: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi

          git push origin "$COMMIT:refs/heads/state"
          echo "State saved: $MSG"
