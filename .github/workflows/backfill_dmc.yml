name: Backfill DMC trade history (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore state from state branch
        run: |
          git fetch origin state --depth=1
          git show origin/state:positions_dmc.json > positions_dmc.json
          git show origin/state:trades_dmc.csv     > trades_dmc.csv
          git show origin/state:safety-check-log-dmc.json > safety-check-log-dmc.json 2>/dev/null || true
          git show origin/state:report.json        > report.json 2>/dev/null || true
          git show origin/state:watchlist_dmc.json > watchlist_dmc.json 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run backfill
        env:
          DATA_DIR: "."
          OKX_API_KEY:    ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: node backfill_dmc_history.js

      - name: Save state to state branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin state:refs/heads/state 2>/dev/null || true

          git read-tree --empty
          for f in positions_dmc.json trades_dmc.csv safety-check-log-dmc.json report.json watchlist_dmc.json; do
            [ -f "$f" ] && git update-index --add "$f"
          done

          TREE=$(git write-tree)
          PARENT=$(git rev-parse --verify refs/heads/state 2>/dev/null || echo "")
          MSG="state: backfill $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi

          git push origin "$COMMIT:refs/heads/state"
          echo "State saved: $MSG"
